<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .inline-table {
    display: inline table;
    width: 120px;
    margin-left: 100px;
    border: 1px solid lightblue;
  }
  .inline-table > p {
    display: table-cell;
  }
</style>
<body>
  <div class="inline-table">
    <p>第1列</p>
    <p>第2列</p>
  </div>
</body>
</html>
