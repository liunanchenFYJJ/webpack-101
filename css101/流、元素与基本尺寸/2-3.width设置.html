<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .nav {
    width: 240px;
    background-color: #cd0000;
    margin: 0 auto;
    margin-top: 20px;
  }
  .nav-a {
    display: block;
    color: #fff;
    border-bottom: 1px solid #b70000;
    border-top: 1px solid #de3636;
    margin: 0 10px;
    padding: 9px 10px;
    text-decoration: none;
  }
  .nav-a:first-child {
    border-top: 0;
  }
  .nav-a:last-child {
    border-bottom: 0;
  }

  /* 画蛇添足 */
  .width {
    width: 100%;
  }

  .bg {
    background-color: lightcyan;
    display: inline-block;
  }
  .div-unit {
    width: 240px;
    display: inline-block;
  }
</style>
<body>
  <div class="nav">
    <a href="" class="nav-a">导航1</a>
    <a href="" class="nav-a">导航2</a>
    <a href="" class="nav-a">导航3</a>
  </div>

  <div class="nav">
    <a href="" class="nav-a width">导航1</a>
    <a href="" class="nav-a width">导航2</a>
    <a href="" class="nav-a width">导航3</a>
  </div>

  <div class="bg">
    <!-- 1,2行之间有幽灵白点 -->
    <div class="div-unit">1</div>
    <div class="div-unit">2</div>
  </div>
</body>
</html>
